[package]
name = "net-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
iced = { version = "0.14.0", features = ["tokio"] }
local-ip-address = "0.6"
futures = "0.3"
dns-lookup = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }